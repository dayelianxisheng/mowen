services:
  mowen:
    container_name: mowen_sim
    build:
      context: .
      dockerfile: Dockerfile
    tty: true
    restart: unless-stopped
    cap_add:
      - SYS_NICE
    ulimits:
      rtprio: 99
      rttime: -1
      memlock: 8428281856
    network_mode: host
    ipc: host
    pid: host
    security_opt:
      - seccomp:unconfined        # Gazebo 9 + kernel 6.x 兼容
    shm_size: '2gb'               # Gazebo 渲染需要大共享内存
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics,display
      # --- GPU 兼容性兜底 (Gazebo 9 on Ubuntu 24.04 host) ---
      # 如果硬件渲染失败，取消下面的注释启用软件渲染:
      # - LIBGL_ALWAYS_SOFTWARE=1
      # - MESA_GL_VERSION_OVERRIDE=3.3
      # - MESA_GLSL_VERSION_OVERRIDE=330
      - GAZEBO_AUDIO_MODE=none
    volumes:
      - /dev:/dev
      - /run/udev:/run/udev
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /tmp/.docker.xauth:/tmp/.docker.xauth:rw
      - ./workspace:/workspace
      - ../src:/root/mowen_ws/src
    privileged: true
    command: bash
