services:
  mowen_ros2:
    container_name: mowen_ros2
    build:
      context: .
      dockerfile: Dockerfile
    tty: true
    restart: unless-stopped
    cap_add:
      - SYS_NICE
    ulimits:
      rtprio: 99
      rttime: -1
      memlock: 8428281856
    network_mode: host
    ipc: host
    pid: host
    security_opt:
      - seccomp:unconfined
    shm_size: '2gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics,display
      - ROS_DOMAIN_ID=30
      - GAZEBO_AUDIO_MODE=none
    volumes:
      - /dev:/dev
      - /run/udev:/run/udev
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /tmp/.docker.xauth:/tmp/.docker.xauth:rw
      - ./workspace:/workspace
      - ../src:/root/mowen_ws/src
      - /home/qcqc/resource/envs/torch:/root/torch-whl:ro
    privileged: true
    command: bash
