# 雷达和相机传感器标定参数
#
# 这些是默认值，如果 Gazebo SDF 中的传感器位置改变，需要同步更新

radar:
  # 雷达在 base_link 下的位置 (SDF 中的 frame 位置)
  frame: "radar_link"
  position: {x: 0.15, y: 0.0, z: 0.18}  # 前方 15cm, 高度 18cm

camera:
  # 相机在 base_link 下的位置
  link: "camera_link"
  optical_frame: "camera_optical"
  position: {x: 0.149, y: -0.0005, z: 0.20}  # 前方 15cm, 高度 20cm

  # 相机内参 (Orbbec Astra 640x480 近似值)
  width: 640
  height: 480
  fx: 570.0
  fy: 570.0
  cx: 320.0
  cy: 240.0

radar_params:
  range_min: 0.5      # m - 最小探测距离
  range_max: 35.0     # m - 最大探测距离
  azimuth_min: -0.7   # rad (-40°)
  azimuth_max: 0.7    # rad (+40°)
  num_beams: 10       # 雷达波束数

crf_net_style:
  # CRF-Net 投影线参数: 雷达点不确定高度的上下界
  height_min: -0.3    # 地面以下 (雷达安装高度偏移)
  height_max: 1.5     # 典型的障碍物高度上限
