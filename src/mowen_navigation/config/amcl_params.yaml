# AMCL parameters for Mecanum omnidirectional robot

# Motion model: "omni" for mecanum wheels (supports lateral movement)
odom_model_type: omni
odom_alpha1: 0.2
odom_alpha2: 0.2
odom_alpha3: 0.2
odom_alpha4: 0.2
odom_alpha5: 0.2

# Laser model
laser_model_type: likelihood_field
laser_likelihood_max_dist: 2.0
laser_max_range: 3.5
laser_min_range: 0.25

# Particle filter
min_particles: 500
max_particles: 2000
pf_err: 0.05
pf_z: 0.99
resample_interval: 1
recovery_alpha_slow: 0.0
recovery_alpha_fast: 0.0

# Update thresholds
update_min_d: 0.25
update_min_a: 0.2

# Beam model (for likelihood_field)
z_hit: 0.5
z_short: 0.05
z_max: 0.05
z_rand: 0.5
sigma_hit: 0.2
lambda_short: 0.1
max_beams: 60

# Frame configuration
odom_frame_id: odom
base_frame_id: base_footprint
global_frame_id: map
tf_broadcast: true
transform_tolerance: 1.0

# Initial pose
initial_pose_x: 0.0
initial_pose_y: 0.0
initial_pose_a: 0.0

# Scan topic
scan_topic: scan

# Beam skip
do_beamskip: false
beam_skip_distance: 0.5
beam_skip_threshold: 0.3
beam_skip_error_threshold: 0.9

# Use map topic (subscribe to /map from map_server)
use_map_topic: true

# Initial pose (from rviz)
set_initial_pose: true
